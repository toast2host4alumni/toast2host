name: Deploy Backend to Azure

on:
  push:
    branches: [main]
    paths:
      - 'apps/backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: ${{ vars.AZURE_BACKEND_APP_NAME }}
  NODE_VERSION: '22.x'
  PNPM_VERSION: '9'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Strapi
        run: pnpm --filter @t2h/backend build
        env:
          NODE_ENV: production

      - name: Create deployment package
        run: |
          # Prune dev dependencies
          cd apps/backend
          pnpm prune --prod

          # Create deployment artifact
          cd ../..
          zip -r backend-deploy.zip apps/backend/ \
            -x "apps/backend/node_modules/.cache/*" \
            -x "apps/backend/.tmp/*" \
            -x "apps/backend/.cache/*"

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_BACKEND_PUBLISH_PROFILE }}
          package: backend-deploy.zip

      - name: Azure Login (for startup command)
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Configure App Service
        uses: azure/cli@v2
        with:
          inlineScript: |
            az webapp config set \
              --name ${{ env.AZURE_WEBAPP_NAME }} \
              --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
              --startup-file "cd apps/backend && npm run start"
